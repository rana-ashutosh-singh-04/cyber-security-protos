<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Security Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: radial-gradient(circle at top, #020617, #000);
      color: #e5e7eb;
      font-family: "Courier New", monospace;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #22c55e;
      letter-spacing: 1px;
    }

    .actions {
      text-align: center;
      margin-bottom: 30px;
    }

    .clear-btn {
      background: #020617;
      color: #f43f5e;
      border: 1px solid #f43f5e;
      padding: 10px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.25s ease;
    }

    .clear-btn:hover {
      background: #2a0208;
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.5);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.05);
      transition: all 0.25s ease;
    }

    .card:hover {
      box-shadow: 0 0 35px rgba(34, 197, 94, 0.25);
      transform: translateY(-2px);
    }

    img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #1e293b;
    }

    .row {
      margin-bottom: 6px;
      font-size: 13px;
      line-height: 1.5;
    }

    .label {
      color: #22c55e;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 13px;
    }

    a:hover {
      text-decoration: underline;
    }

    .time {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
      text-align: right;
    }
  </style>
</head>

<body>

  <h1>🛡️ SECURITY ADMIN PANEL</h1>

  <div class="actions">
    <button class="clear-btn" onclick="clearData()">
      🗑 CLEAR ALL LOGS
    </button>
  </div>

  <div id="container" class="grid"></div>

  <script>
    function clearData() {
      if (!confirm("Are you sure you want to delete all logs?")) return;

      fetch("http://localhost:5000/admin/clear", { method: "DELETE" })
        .then(res => res.json())
        .then(msg => {
          alert(msg.message);
          location.reload();
        });
    }

    fetch("http://localhost:5000/admin/data")
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("container");

        if (!data.length) {
          container.innerHTML = "<h3>No logs found</h3>";
          return;
        }

       data.forEach(item => {
  const card = document.createElement("div");
  card.className = "card";

  // Image
  if (item.image) {
    card.innerHTML += `
      <img src="${item.image}" />
    `;
  }

  // Device info
  if (item.userAgent) {
    card.innerHTML += `
      <div class="row">
        <span class="label">🖥 DEVICE:</span>
        ${item.userAgent}
      </div>
    `;
  }

  // Time
  card.innerHTML += `
    <div class="row">
      <span class="label">⏰ TIME:</span>
      ${new Date(item.createdAt).toLocaleString("en-IN")}
    </div>
  `;

  // Embedded map (same container)
  if (item.latitude && item.longitude) {
    card.innerHTML += `
      <div class="row">
        <span class="label">📍 LOCATION:</span>
        ${item.latitude}, ${item.longitude}
      </div>

      <iframe
        width="100%"
        height="180"
        style="border-radius:10px; margin-top:10px; border:1px solid #1e293b;"
        loading="lazy"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade"
        src="https://www.google.com/maps?q=${item.latitude},${item.longitude}&output=embed">
      </iframe>
    `;
  }

  container.appendChild(card);
});

      });

      
      fetch("http://localhost:5000/tracked/data")
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById("container");

    if (!data.length) {
      container.innerHTML = "<h3>No data available</h3>";
      return;
    }

    data.forEach(item => {
      console.log(item); // ✅ CORRECT place

      const card = document.createElement("div");
      card.className = "card";

      // Device info
      if (item.userAgent) {
        card.innerHTML += `
          <div class="row">
            <span class="label">🖥 DEVICE:</span>
            ${item.userAgent}
          </div>
        `;
      }

      // Time
      card.innerHTML += `
        <div class="row">
          <span class="label">⏰ TIME:</span>
          ${new Date(item.createdAt).toLocaleString("en-IN")}
        </div>
      `;

      // Embedded map (same container)
      if (item.latitude && item.longitude) {
        card.innerHTML += `
          <div class="row">
            <span class="label">📍 LOCATION:</span>
            ${item.latitude}, ${item.longitude}
          </div>

          <iframe
            width="100%"
            height="180"
            style="border-radius:10px; margin-top:10px; border:1px solid #1e293b;"
            loading="lazy"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade"
            src="https://www.google.com/maps?q=${item.latitude},${item.longitude}&output=embed">
          </iframe>
        `;
      }

      container.appendChild(card);
    });
  })
  .catch(err => console.error("Fetch error:", err));

  </script>

</body>
</html>
